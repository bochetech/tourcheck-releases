<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
  <style>
    :root {
      --papel: oklch(0.975 0.014 85);
      --papel-alto: oklch(0.995 0.006 85);
      --tinta: oklch(0.28 0.03 60);
      --tinta-suave: oklch(0.52 0.03 60);
      --terracota: oklch(0.62 0.14 45);
      --teal: oklch(0.62 0.14 200);
      --verde: oklch(0.62 0.14 145);
      --borde: oklch(0.90 0.02 75);
      --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
      --lectura: "Literata", ui-serif, Georgia, serif;
    }
    body { margin: 0; background: var(--papel); color: var(--tinta); font-family: var(--lectura); }
    a { color: var(--terracota); } a:hover { color: oklch(0.52 0.14 45); }
  </style>
</helmet>

<div style="width: 1024px; height: 768px; display: flex; background: var(--papel); overflow: hidden">
  <div style="width: 236px; flex-shrink: 0; background: var(--papel-alto); border-right: 1.5px solid var(--borde); display: flex; flex-direction: column; align-items: center; padding: 26px 20px; gap: 14px">

    <div style="position: relative">
      <svg width="148" height="148" viewBox="0 0 120 120" fill="none" aria-label="Copi"><ellipse cx="60" cy="112" rx="33" ry="5.5" fill="oklch(0.28 0.03 60 / 0.10)"/><path d="M60 24c0-8 6-14 14-14 0 8-6 14-14 14z" fill="var(--verde)"/><path d="M60 24c0-7-5-12-12-11 1 7 5 11 12 11z" fill="var(--verde)" opacity="0.72"/><path d="M60 24v7" stroke="var(--verde)" stroke-width="3.4" stroke-linecap="round"/><rect x="16" y="30" width="88" height="78" rx="33" fill="var(--teal)"/><rect x="25" y="38" width="70" height="50" rx="25" fill="oklch(0.72 0.10 200)"/><path d="M39.5 63.5q6.5-8 13 0" stroke="oklch(0.24 0.04 240)" stroke-width="4.4" fill="none" stroke-linecap="round"/><path d="M67.5 63.5q6.5-8 13 0" stroke="oklch(0.24 0.04 240)" stroke-width="4.4" fill="none" stroke-linecap="round"/><path d="M49 76q11 11 22 0" stroke="oklch(0.24 0.04 240)" stroke-width="3.4" fill="none" stroke-linecap="round"/></svg>
    </div>

    <div style="font-family: var(--display); font-size: 22px; font-weight: 800; letter-spacing: -0.01em">Copi</div>

    <div style="display: flex; align-items: center; gap: 8px; background: oklch(0.62 0.14 200 / 0.12); border-radius: 999px; padding: 7px 14px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M2.5 12s3.6-6 9.5-6 9.5 6 9.5 6-3.6 6-9.5 6-9.5-6-9.5-6z" stroke="oklch(0.44 0.13 200)" stroke-width="2"/><circle cx="12" cy="12" r="2.6" fill="oklch(0.44 0.13 200)"/></svg>
      <span style="font-family: var(--display); font-size: 14px; font-weight: 600; color: oklch(0.44 0.13 200)">te acompaña</span>
    </div>

    <div style="background: var(--papel); border: 1.5px solid var(--borde); border-radius: 16px; padding: 14px 16px; font-size: 16px; line-height: 1.45; text-align: center">
      Buenos días, Mateo.<br>Empezamos por lo de ayer, con calma.
    </div>

    <div style="flex-grow: 1"></div>

    <div style="font-size: 13px; color: var(--tinta-suave); text-align: center; line-height: 1.45">Llevamos 43 días<br>aprendiendo juntos</div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden">

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 26px 32px 0 32px">
      <div>
        <div style="font-family: var(--display); font-size: 27px; font-weight: 800; letter-spacing: -0.01em">Hoy tenemos tres paradas</div>
        <div style="font-size: 16px; color: var(--tinta-suave); margin-top: 4px">Miércoles 8 de septiembre</div>
      </div>
      <div style="display: flex; align-items: center; gap: 9px; background: var(--papel-alto); border: 1.5px solid var(--borde); border-radius: 999px; padding: 9px 16px">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none">
          <path d="M12 3l2.5 5.6 6.1.7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6L3.4 9.3l6.1-.7z" stroke="var(--terracota)" stroke-width="2" stroke-linejoin="round"/>
        </svg>
        <span style="font-family: var(--display); font-weight: 600; font-size: 16px">7 días seguidos</span>
      </div>
    </div>

    <div style="position: relative; flex-grow: 1; margin: 10px 32px 0 32px">
      <svg width="724" height="392" viewBox="0 0 724 392" fill="none" style="position: absolute; inset: 0" aria-hidden="true">
        <path d="M78 276 C 180 276, 180 138, 282 138 S 430 276, 532 276 S 636 156, 652 138"
              stroke="var(--borde)" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 20"/>
        <path d="M78 276 C 180 276, 180 138, 282 138 S 380 240, 424 262"
              stroke="var(--verde)" stroke-width="9" stroke-linecap="round"/>
      </svg>

      <div style="position: absolute; left: 26px; top: 218px; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 104px">
        <div style="width: 68px; height: 68px; border-radius: 50%; background: var(--verde); display: flex; align-items: center; justify-content: center">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div style="font-family: var(--display); font-weight: 600; font-size: 16px; text-align: center">Lectura</div>
      </div>

      <div style="position: absolute; left: 222px; top: 62px; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 120px">
        <div style="width: 96px; height: 96px; border-radius: 50%; background: var(--terracota); box-shadow: 0 0 0 9px oklch(0.62 0.14 45 / 0.18); display: flex; align-items: center; justify-content: center">
          <svg width="42" height="42" viewBox="0 0 24 24" fill="none">
            <path d="M4 7h7M7.5 4v6M14 6.5h6M14 17h6M17 14v6" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
            <path d="M4.5 16.5l5-5M9.5 16.5l-5-5" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
        </div>
        <div style="font-family: var(--display); font-weight: 800; font-size: 20px; text-align: center">Matemática</div>
        <div style="font-size: 15px; color: var(--tinta-suave); text-align: center; line-height: 1.35">Restar<br>llevando</div>
      </div>

      <div style="position: absolute; left: 596px; top: 84px; display: flex; flex-direction: column; align-items: center; gap: 8px; width: 104px">
        <div style="width: 68px; height: 68px; border-radius: 50%; background: var(--papel-alto); border: 3px dashed var(--borde); display: flex; align-items: center; justify-content: center">
          <svg width="29" height="29" viewBox="0 0 24 24" fill="none">
            <path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18" stroke="var(--tinta-suave)" stroke-width="2" stroke-linecap="round"/>
            <circle cx="12" cy="12" r="3" stroke="var(--tinta-suave)" stroke-width="2"/>
          </svg>
        </div>
        <div style="font-family: var(--display); font-weight: 600; font-size: 16px; text-align: center; color: var(--tinta-suave)">Ciencias</div>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 16px; padding: 0 32px 30px 32px">
      <button style="flex-grow: 1; height: 84px; border: none; border-radius: 22px; background: var(--terracota); color: white; font-family: var(--display); font-size: 25px; font-weight: 800; letter-spacing: -0.01em; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 13px; box-shadow: 0 4px 0 oklch(0.50 0.13 45)">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M7 4.5v15l13-7.5z" fill="white"/></svg>
        Empezar con Copi
      </button>
      <div style="display: flex; align-items: center; gap: 11px; height: 84px; padding: 0 22px; border-radius: 22px; border: 1.5px solid var(--borde); background: var(--papel-alto)">
        <svg width="25" height="25" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M16 19a4 4 0 10-8 0" stroke="var(--teal)" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="9" r="4" stroke="var(--teal)" stroke-width="2"/>
        </svg>
        <div style="display: flex; flex-direction: column">
          <span style="font-family: var(--display); font-weight: 600; font-size: 16px">Con papá</span>
          <span style="font-size: 14px; color: var(--tinta-suave)">tras Ciencias</span>
        </div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
