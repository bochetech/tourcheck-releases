<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
  <style>
    :root {
      --papel: oklch(0.975 0.014 85);
      --papel-alto: oklch(0.995 0.006 85);
      --tinta: oklch(0.28 0.03 60);
      --tinta-suave: oklch(0.52 0.03 60);
      --terracota: oklch(0.62 0.14 45);
      --teal: oklch(0.62 0.14 200);
      --verde: oklch(0.62 0.14 145);
      --borde: oklch(0.90 0.02 75);
      --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
      --lectura: "Literata", ui-serif, Georgia, serif;
    }
    body { margin: 0; background: var(--papel); color: var(--tinta); font-family: var(--lectura); }
    a { color: var(--terracota); } a:hover { color: oklch(0.52 0.14 45); }
  </style>
</helmet>

<div style="width: 1024px; height: 768px; display: flex; flex-direction: column; background: var(--papel); overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 28px 40px 0 40px">
    <div style="display: flex; align-items: center; gap: 16px">
      <svg width="52" height="52" viewBox="0 0 52 52" fill="none" aria-hidden="true">
        <circle cx="26" cy="26" r="24" fill="oklch(0.62 0.14 200 / 0.14)"/>
        <circle cx="26" cy="24" r="13" fill="none" stroke="oklch(0.62 0.14 200)" stroke-width="2.5"/>
        <circle cx="21" cy="22" r="2.2" fill="oklch(0.62 0.14 200)"/>
        <circle cx="31" cy="22" r="2.2" fill="oklch(0.62 0.14 200)"/>
        <path d="M20 29c2.4 2.6 9.6 2.6 12 0" stroke="oklch(0.62 0.14 200)" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="font-family: var(--display); font-size: 30px; font-weight: 800; letter-spacing: -0.01em">Buenos días, Mateo</div>
        <div style="font-size: 16px; color: var(--tinta-suave)">Hoy tenemos tres paradas</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; background: var(--papel-alto); border: 1.5px solid var(--borde); border-radius: 999px; padding: 10px 18px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 3l2.5 5.6 6.1.7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6L3.4 9.3l6.1-.7z" stroke="var(--terracota)" stroke-width="2" stroke-linejoin="round"/>
      </svg>
      <span style="font-family: var(--display); font-weight: 600; font-size: 17px">7 días seguidos</span>
    </div>
  </div>

  <div style="position: relative; flex-grow: 1; margin: 8px 40px 0 40px">
    <svg width="944" height="430" viewBox="0 0 944 430" fill="none" style="position: absolute; inset: 0" aria-hidden="true">
      <path d="M120 300 C 250 300, 250 150, 380 150 S 560 300, 690 300 S 830 170, 850 150"
            stroke="var(--borde)" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 22"/>
      <path d="M120 300 C 250 300, 250 150, 380 150 S 500 260, 560 285"
            stroke="var(--verde)" stroke-width="10" stroke-linecap="round"/>
    </svg>

    <div style="position: absolute; left: 60px; top: 236px; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 128px">
      <div style="width: 76px; height: 76px; border-radius: 50%; background: var(--verde); display: flex; align-items: center; justify-content: center">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div style="font-family: var(--display); font-weight: 600; font-size: 17px; text-align: center">Lectura</div>
    </div>

    <div style="position: absolute; left: 316px; top: 62px; display: flex; flex-direction: column; align-items: center; gap: 12px; width: 128px">
      <div style="width: 104px; height: 104px; border-radius: 50%; background: var(--terracota); box-shadow: 0 0 0 10px oklch(0.62 0.14 45 / 0.18); display: flex; align-items: center; justify-content: center">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none">
          <path d="M4 7h7M7.5 4v6M14 6.5h6M14 17h6M17 14v6" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M4.5 16.5l5-5M9.5 16.5l-5-5" stroke="white" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
      </div>
      <div style="font-family: var(--display); font-weight: 800; font-size: 21px; text-align: center">Matemática</div>
      <div style="font-size: 15px; color: var(--tinta-suave); text-align: center; line-height: 1.35">Restar<br>llevando</div>
    </div>

    <div style="position: absolute; left: 786px; top: 86px; display: flex; flex-direction: column; align-items: center; gap: 10px; width: 128px">
      <div style="width: 76px; height: 76px; border-radius: 50%; background: var(--papel-alto); border: 3px dashed var(--borde); display: flex; align-items: center; justify-content: center">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
          <path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M18 6l-2.5 2.5M8.5 15.5L6 18" stroke="var(--tinta-suave)" stroke-width="2" stroke-linecap="round"/>
          <circle cx="12" cy="12" r="3" stroke="var(--tinta-suave)" stroke-width="2"/>
        </svg>
      </div>
      <div style="font-family: var(--display); font-weight: 600; font-size: 17px; text-align: center; color: var(--tinta-suave)">Ciencias</div>
    </div>

    <div style="position: absolute; left: 486px; top: 250px; display: flex; align-items: flex-start; gap: 12px; max-width: 300px">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none" style="flex-shrink: 0; margin-top: 2px" aria-hidden="true">
        <circle cx="17" cy="17" r="16" fill="oklch(0.62 0.14 200 / 0.14)"/>
        <circle cx="17" cy="16" r="8.5" fill="none" stroke="oklch(0.62 0.14 200)" stroke-width="2"/>
        <circle cx="13.8" cy="14.6" r="1.5" fill="oklch(0.62 0.14 200)"/>
        <circle cx="20.2" cy="14.6" r="1.5" fill="oklch(0.62 0.14 200)"/>
        <path d="M13.2 19.4c1.6 1.7 6 1.7 7.6 0" stroke="oklch(0.62 0.14 200)" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div style="background: var(--papel-alto); border: 1.5px solid var(--borde); border-radius: 18px 18px 18px 4px; padding: 14px 18px; font-size: 17px; line-height: 1.45">
        Ayer casi lo tenías. Hoy lo vemos otra vez, con calma.
      </div>
    </div>
  </div>

  <div style="display: flex; align-items: center; gap: 20px; padding: 0 40px 36px 40px">
    <button style="flex-grow: 1; height: 88px; border: none; border-radius: 22px; background: var(--terracota); color: white; font-family: var(--display); font-size: 27px; font-weight: 800; letter-spacing: -0.01em; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 14px; box-shadow: 0 4px 0 oklch(0.50 0.13 45)">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M7 4.5v15l13-7.5z" fill="white"/></svg>
      Empezar Matemática
    </button>
    <div style="display: flex; align-items: center; gap: 12px; height: 88px; padding: 0 24px; border-radius: 22px; border: 1.5px solid var(--borde); background: var(--papel-alto)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M16 19a4 4 0 10-8 0" stroke="var(--teal)" stroke-width="2" stroke-linecap="round"/>
        <circle cx="12" cy="9" r="4" stroke="var(--teal)" stroke-width="2"/>
      </svg>
      <div style="display: flex; flex-direction: column">
        <span style="font-family: var(--display); font-weight: 600; font-size: 17px">Con papá</span>
        <span style="font-size: 15px; color: var(--tinta-suave)">después de Ciencias</span>
      </div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
