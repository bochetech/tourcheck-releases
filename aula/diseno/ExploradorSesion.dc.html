<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
  <style>
    :root {
      --papel: oklch(0.975 0.014 85);
      --papel-alto: oklch(0.995 0.006 85);
      --tinta: oklch(0.28 0.03 60);
      --tinta-suave: oklch(0.52 0.03 60);
      --terracota: oklch(0.62 0.14 45);
      --teal: oklch(0.62 0.14 200);
      --verde: oklch(0.62 0.14 145);
      --borde: oklch(0.90 0.02 75);
      --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
      --lectura: "Literata", ui-serif, Georgia, serif;
    }
    body { margin: 0; background: var(--papel); color: var(--tinta); font-family: var(--lectura); }
    a { color: var(--terracota); } a:hover { color: oklch(0.52 0.14 45); }
  </style>
</helmet>

<div style="width: 1024px; height: 768px; display: flex; background: var(--papel); overflow: hidden">
  <div style="width: 236px; flex-shrink: 0; background: var(--papel-alto); border-right: 1.5px solid var(--borde); display: flex; flex-direction: column; align-items: center; padding: 26px 20px; gap: 14px">

    <div style="position: relative">
      <svg width="148" height="148" viewBox="0 0 120 120" fill="none" aria-label="Copi"><ellipse cx="60" cy="112" rx="33" ry="5.5" fill="oklch(0.28 0.03 60 / 0.10)"/><path d="M60 24c0-8 6-14 14-14 0 8-6 14-14 14z" fill="var(--verde)"/><path d="M60 24c0-7-5-12-12-11 1 7 5 11 12 11z" fill="var(--verde)" opacity="0.72"/><path d="M60 24v7" stroke="var(--verde)" stroke-width="3.4" stroke-linecap="round"/><rect x="16" y="30" width="88" height="78" rx="33" fill="var(--teal)"/><rect x="25" y="38" width="70" height="50" rx="25" fill="oklch(0.72 0.10 200)"/><circle cx="46" cy="61" r="6.5" fill="oklch(0.24 0.04 240)"/><circle cx="74" cy="61" r="6.5" fill="oklch(0.24 0.04 240)"/><circle cx="48.3" cy="58.4" r="2.1" fill="white"/><circle cx="76.3" cy="58.4" r="2.1" fill="white"/><ellipse cx="60" cy="79" rx="5" ry="6" fill="oklch(0.24 0.04 240)"/></svg>
    </div>

    <div style="font-family: var(--display); font-size: 22px; font-weight: 800; letter-spacing: -0.01em">Copi</div>

    <div style="display: flex; align-items: center; gap: 8px; background: oklch(0.62 0.14 200 / 0.12); border-radius: 999px; padding: 7px 14px">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 4v16M8 7v10M16 7v10M4 10v4M20 10v4" stroke="oklch(0.44 0.13 200)" stroke-width="2.4" stroke-linecap="round"/></svg>
      <span style="font-family: var(--display); font-size: 14px; font-weight: 600; color: oklch(0.44 0.13 200)">te escucha</span>
    </div>

    <div style="background: var(--papel); border: 1.5px solid var(--borde); border-radius: 16px; padding: 14px 16px; font-size: 16px; line-height: 1.45; text-align: center">
      A 2 no le puedo quitar 5.<br>¿Qué hacemos con la decena?
    </div>

    <div style="flex-grow: 1"></div>

    <div style="font-size: 13px; color: var(--tinta-suave); text-align: center; line-height: 1.45">Copi no se va cuando<br>te toca a ti</div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; overflow: hidden">

    <div style="display: flex; align-items: center; justify-content: space-between; padding: 22px 28px 0 28px">
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="width: 46px; height: 46px; border-radius: 14px; border: 1.5px solid var(--borde); background: var(--papel-alto); display: flex; align-items: center; justify-content: center">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="var(--tinta-suave)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div style="font-family: var(--display); font-size: 20px; font-weight: 600">Restar llevando</div>
      </div>
      <div style="display: flex; align-items: center; gap: 8px">
        <div style="width: 13px; height: 13px; border-radius: 50%; background: var(--verde)"></div>
        <div style="width: 13px; height: 13px; border-radius: 50%; background: var(--verde)"></div>
        <div style="width: 19px; height: 19px; border-radius: 50%; background: var(--terracota); box-shadow: 0 0 0 5px oklch(0.62 0.14 45 / 0.18)"></div>
        <div style="width: 13px; height: 13px; border-radius: 50%; background: var(--borde)"></div>
        <div style="width: 13px; height: 13px; border-radius: 50%; background: var(--borde)"></div>
      </div>
    </div>

    <div style="display: flex; gap: 22px; padding: 20px 28px 0 28px; flex-grow: 1; overflow: hidden">

      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 16px">

        <div style="background: var(--papel-alto); border: 1.5px solid var(--borde); border-radius: 22px; padding: 24px 28px">
          <div style="font-size: 14px; color: var(--tinta-suave); letter-spacing: 0.06em; text-transform: uppercase; font-family: var(--display); font-weight: 600">Resuélvelo en tu cuaderno</div>
          <div style="display: flex; align-items: baseline; gap: 16px; margin-top: 12px; font-family: var(--display); font-weight: 800; font-size: 58px; letter-spacing: -0.02em; line-height: 1">
            <span>42</span><span style="color: var(--terracota)">&minus;</span><span>15</span>
          </div>
        </div>

        <div style="flex-grow: 1"></div>

        <div style="background: oklch(0.62 0.14 200 / 0.10); border: 2px solid var(--teal); border-radius: 22px; padding: 20px 24px; display: flex; align-items: center; gap: 18px">
          <div style="flex-grow: 1">
            <div style="font-size: 15px; color: var(--tinta-suave)">Copi escuchó</div>
            <div style="font-family: var(--display); font-weight: 800; font-size: 36px; letter-spacing: -0.01em; line-height: 1.15">veintisiete</div>
          </div>
          <div style="display: flex; gap: 10px">
            <button style="width: 84px; height: 66px; border-radius: 16px; border: none; background: var(--verde); cursor: pointer; display: flex; align-items: center; justify-content: center">
              <svg width="32" height="32" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button style="width: 84px; height: 66px; border-radius: 16px; border: 2px solid var(--borde); background: var(--papel-alto); cursor: pointer; display: flex; align-items: center; justify-content: center">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="var(--tinta-suave)" stroke-width="3" stroke-linecap="round"/></svg>
            </button>
          </div>
        </div>

        <button style="height: 78px; border-radius: 22px; border: 3px solid var(--teal); background: oklch(0.62 0.14 200 / 0.10); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 13px; font-family: var(--display); font-size: 21px; font-weight: 800; color: var(--teal); letter-spacing: -0.01em">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
            <rect x="9" y="2.5" width="6" height="12" rx="3" stroke="var(--teal)" stroke-width="2.4"/>
            <path d="M5 11a7 7 0 0014 0M12 18v3.5" stroke="var(--teal)" stroke-width="2.4" stroke-linecap="round"/>
          </svg>
          Mantén apretado para hablar
        </button>

      </div>

      <div style="width: 228px; display: flex; flex-direction: column; gap: 12px; flex-shrink: 0">
        <div style="font-size: 13px; color: var(--tinta-suave); letter-spacing: 0.06em; text-transform: uppercase; font-family: var(--display); font-weight: 600; text-align: center">o escríbelo</div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
          <button style="height: 68px; border-radius: 16px; border: 1.5px solid var(--borde); background: var(--papel-alto); font-family: var(--display); font-weight: 600; font-size: 26px; color: var(--tinta); cursor: pointer">1</button>
          <button style="height: 68px; border-radius: 16px; border: 1.5px solid var(--borde); background: var(--papel-alto); font-family: var(--display); font-weight: 600; font-size: 26px; color: var(--tinta); cursor: pointer">2</button>
          <button style="height: 68px; border-radius: 16px; border: 1.5px solid var(--borde); background: var(--papel-alto); font-family: var(--display); font-weight: 600; font-size: 26px; color: var(--tinta); cursor: pointer">3</button>
          <button style="height: 68px; border-radius: 16px; border: 1.5px solid var(--borde); background: var(--papel-alto); font-family: var(--display); font-weight: 600; font-size: 26px; color: var(--tinta); cursor: pointer">4</button>
          <button style="height: 68px; border-radius: 16px; border: 1.5px solid var(--borde); background: var(--papel-alto); font-family: var(--display); font-weight: 600; font-size: 26px; color: var(--tinta); cursor: pointer">5</button>
          <button style="height: 68px; border-radius: 16px; border: 1.5px solid var(--borde); background: var(--papel-alto); font-family: var(--display); font-weight: 600; font-size: 26px; color: var(--tinta); cursor: pointer">6</button>
          <button style="height: 68px; border-radius: 16px; border: 1.5px solid var(--borde); background: var(--papel-alto); font-family: var(--display); font-weight: 600; font-size: 26px; color: var(--tinta); cursor: pointer">7</button>
          <button style="height: 68px; border-radius: 16px; border: 1.5px solid var(--borde); background: var(--papel-alto); font-family: var(--display); font-weight: 600; font-size: 26px; color: var(--tinta); cursor: pointer">8</button>
          <button style="height: 68px; border-radius: 16px; border: 1.5px solid var(--borde); background: var(--papel-alto); font-family: var(--display); font-weight: 600; font-size: 26px; color: var(--tinta); cursor: pointer">9</button>
          <button style="height: 68px; border-radius: 16px; border: 1.5px solid var(--borde); background: var(--papel-alto); font-family: var(--display); font-weight: 600; font-size: 26px; color: var(--tinta-suave); cursor: pointer">&larr;</button>
          <button style="height: 68px; border-radius: 16px; border: 1.5px solid var(--borde); background: var(--papel-alto); font-family: var(--display); font-weight: 600; font-size: 26px; color: var(--tinta); cursor: pointer">0</button>
          <button style="height: 68px; border-radius: 16px; border: none; background: var(--verde); cursor: pointer; display: flex; align-items: center; justify-content: center">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>

    </div>
    <div style="height: 26px"></div>
  </div>
</div>
</x-dc>
</body>
</html>
