<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
  <style>
    :root {
      --papel: oklch(0.975 0.014 85);
      --papel-alto: oklch(0.995 0.006 85);
      --tinta: oklch(0.28 0.03 60);
      --tinta-suave: oklch(0.52 0.03 60);
      --terracota: oklch(0.62 0.14 45);
      --teal: oklch(0.62 0.14 200);
      --verde: oklch(0.62 0.14 145);
      --borde: oklch(0.90 0.02 75);
      --display: "Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
      --lectura: "Literata", ui-serif, Georgia, serif;
    }
    body { margin: 0; background: var(--papel); color: var(--tinta); font-family: var(--lectura); }
    a { color: var(--terracota); } a:hover { color: oklch(0.52 0.14 45); }
  </style>
</helmet>

<div style="width: 1024px; height: 768px; display: flex; flex-direction: column; background: var(--papel); overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 22px 36px 0 36px">
    <div style="display: flex; align-items: center; gap: 14px">
      <div style="width: 52px; height: 52px; border-radius: 16px; border: 1.5px solid var(--borde); background: var(--papel-alto); display: flex; align-items: center; justify-content: center">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="var(--tinta-suave)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div style="font-family: var(--display); font-size: 22px; font-weight: 600">Restar llevando</div>
    </div>
    <div style="display: flex; align-items: center; gap: 9px">
      <div style="width: 15px; height: 15px; border-radius: 50%; background: var(--verde)"></div>
      <div style="width: 15px; height: 15px; border-radius: 50%; background: var(--verde)"></div>
      <div style="width: 21px; height: 21px; border-radius: 50%; background: var(--terracota); box-shadow: 0 0 0 5px oklch(0.62 0.14 45 / 0.18)"></div>
      <div style="width: 15px; height: 15px; border-radius: 50%; background: var(--borde)"></div>
      <div style="width: 15px; height: 15px; border-radius: 50%; background: var(--borde)"></div>
    </div>
  </div>

  <div style="display: flex; gap: 28px; padding: 24px 36px 0 36px; flex-grow: 1">

    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 20px">

      <div style="background: var(--papel-alto); border: 1.5px solid var(--borde); border-radius: 24px; padding: 30px 34px">
        <div style="font-size: 15px; color: var(--tinta-suave); letter-spacing: 0.06em; text-transform: uppercase; font-family: var(--display); font-weight: 600">Resuélvelo en tu cuaderno</div>
        <div style="display: flex; align-items: baseline; gap: 18px; margin-top: 14px; font-family: var(--display); font-weight: 800; font-size: 68px; letter-spacing: -0.02em; line-height: 1">
          <span>42</span><span style="color: var(--terracota)">&minus;</span><span>15</span>
        </div>
      </div>

      <div style="display: flex; align-items: flex-start; gap: 14px">
        <svg width="42" height="42" viewBox="0 0 42 42" fill="none" style="flex-shrink: 0" aria-hidden="true">
          <circle cx="21" cy="21" r="20" fill="oklch(0.62 0.14 200 / 0.14)"/>
          <circle cx="21" cy="20" r="10.5" fill="none" stroke="var(--teal)" stroke-width="2.2"/>
          <circle cx="17" cy="18.4" r="1.8" fill="var(--teal)"/>
          <circle cx="25" cy="18.4" r="1.8" fill="var(--teal)"/>
          <path d="M16.4 24c2 2.1 7.2 2.1 9.2 0" stroke="var(--teal)" stroke-width="2.2" stroke-linecap="round"/>
        </svg>
        <div style="flex-grow: 1">
          <div style="background: var(--papel-alto); border: 1.5px solid var(--borde); border-radius: 20px 20px 20px 5px; padding: 18px 22px; font-size: 21px; line-height: 1.45">
            A 2 no le puedo quitar 5. ¿Qué podemos hacer con la decena?
          </div>
          <div style="display: flex; align-items: center; gap: 8px; margin-top: 12px; padding-left: 4px">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M12 3v10M12 16v5M8 6v5M16 8v7M4 9v3M20 10v3" stroke="var(--teal)" stroke-width="2.4" stroke-linecap="round"/>
            </svg>
            <span style="font-size: 15px; color: var(--tinta-suave)">Escuchando la explicación</span>
          </div>
        </div>
      </div>

      <div style="flex-grow: 1"></div>

      <div style="background: oklch(0.62 0.14 200 / 0.10); border: 2px solid var(--teal); border-radius: 24px; padding: 22px 26px; display: flex; align-items: center; gap: 22px">
        <div style="flex-grow: 1">
          <div style="font-size: 16px; color: var(--tinta-suave)">Escuché</div>
          <div style="font-family: var(--display); font-weight: 800; font-size: 40px; letter-spacing: -0.01em; line-height: 1.15">veintisiete</div>
        </div>
        <div style="display: flex; gap: 12px">
          <button style="width: 92px; height: 72px; border-radius: 18px; border: none; background: var(--verde); cursor: pointer; display: flex; align-items: center; justify-content: center">
            <svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button style="width: 92px; height: 72px; border-radius: 18px; border: 2px solid var(--borde); background: var(--papel-alto); cursor: pointer; display: flex; align-items: center; justify-content: center">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" stroke="var(--tinta-suave)" stroke-width="3" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>

    </div>

    <div style="width: 268px; display: flex; flex-direction: column; gap: 14px">
      <div style="font-size: 14px; color: var(--tinta-suave); letter-spacing: 0.06em; text-transform: uppercase; font-family: var(--display); font-weight: 600; text-align: center">o escríbelo</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
        <button style="height: 74px; border-radius: 18px; border: 1.5px solid var(--borde); background: var(--papel-alto); font-family: var(--display); font-weight: 600; font-size: 28px; color: var(--tinta); cursor: pointer">1</button>
        <button style="height: 74px; border-radius: 18px; border: 1.5px solid var(--borde); background: var(--papel-alto); font-family: var(--display); font-weight: 600; font-size: 28px; color: var(--tinta); cursor: pointer">2</button>
        <button style="height: 74px; border-radius: 18px; border: 1.5px solid var(--borde); background: var(--papel-alto); font-family: var(--display); font-weight: 600; font-size: 28px; color: var(--tinta); cursor: pointer">3</button>
        <button style="height: 74px; border-radius: 18px; border: 1.5px solid var(--borde); background: var(--papel-alto); font-family: var(--display); font-weight: 600; font-size: 28px; color: var(--tinta); cursor: pointer">4</button>
        <button style="height: 74px; border-radius: 18px; border: 1.5px solid var(--borde); background: var(--papel-alto); font-family: var(--display); font-weight: 600; font-size: 28px; color: var(--tinta); cursor: pointer">5</button>
        <button style="height: 74px; border-radius: 18px; border: 1.5px solid var(--borde); background: var(--papel-alto); font-family: var(--display); font-weight: 600; font-size: 28px; color: var(--tinta); cursor: pointer">6</button>
        <button style="height: 74px; border-radius: 18px; border: 1.5px solid var(--borde); background: var(--papel-alto); font-family: var(--display); font-weight: 600; font-size: 28px; color: var(--tinta); cursor: pointer">7</button>
        <button style="height: 74px; border-radius: 18px; border: 1.5px solid var(--borde); background: var(--papel-alto); font-family: var(--display); font-weight: 600; font-size: 28px; color: var(--tinta); cursor: pointer">8</button>
        <button style="height: 74px; border-radius: 18px; border: 1.5px solid var(--borde); background: var(--papel-alto); font-family: var(--display); font-weight: 600; font-size: 28px; color: var(--tinta); cursor: pointer">9</button>
        <button style="height: 74px; border-radius: 18px; border: 1.5px solid var(--borde); background: var(--papel-alto); font-family: var(--display); font-weight: 600; font-size: 28px; color: var(--tinta-suave); cursor: pointer">&larr;</button>
        <button style="height: 74px; border-radius: 18px; border: 1.5px solid var(--borde); background: var(--papel-alto); font-family: var(--display); font-weight: 600; font-size: 28px; color: var(--tinta); cursor: pointer">0</button>
        <button style="height: 74px; border-radius: 18px; border: none; background: var(--verde); cursor: pointer; display: flex; align-items: center; justify-content: center">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

  </div>

  <div style="display: flex; align-items: center; gap: 20px; padding: 22px 36px 30px 36px">
    <button style="flex-grow: 1; height: 92px; border-radius: 24px; border: 3px solid var(--teal); background: oklch(0.62 0.14 200 / 0.10); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 16px; font-family: var(--display); font-size: 25px; font-weight: 800; color: var(--teal); letter-spacing: -0.01em">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none">
        <rect x="9" y="2.5" width="6" height="12" rx="3" stroke="var(--teal)" stroke-width="2.4"/>
        <path d="M5 11a7 7 0 0014 0M12 18v3.5" stroke="var(--teal)" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      Mantén apretado para hablar
    </button>
    <button style="height: 92px; padding: 0 26px; border-radius: 24px; border: 1.5px solid var(--borde); background: var(--papel-alto); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none">
        <path d="M12 3a9 9 0 100 18M12 3a9 9 0 010 18" stroke="var(--tinta-suave)" stroke-width="2"/>
        <path d="M12 8v5l3 2" stroke="var(--tinta-suave)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span style="font-family: var(--display); font-size: 15px; font-weight: 600; color: var(--tinta-suave)">Repite</span>
    </button>
  </div>

</div>
</x-dc>
</body>
</html>
