# Qué modelo usa cada rol. Editable sin tocar código.
#
# Los roles no son intercambiables: el tutor tiene que sostener el método
# socrático, el anclaje corre en cada turno y debe ser barato, y la extracción
# va por lotes sin ningún niño delante.

perfil_por_defecto: lmstudio

proveedores:
  ollama:
    base_url: http://${AULA_HOST_LLM:-127.0.0.1}:11434/v1
    api_key_env: OLLAMA_API_KEY
    apto_para_menores: true
    notas: >-
      Corre en tu Mac. Los datos del niño no salen de casa, así que no hay
      términos de terceros que apliquen.

  lmstudio:
    base_url: http://${AULA_HOST_LLM:-127.0.0.1}:1234/v1
    api_key_env: LMSTUDIO_API_KEY
    apto_para_menores: true
    notas: >-
      Corre nativo en el Mac, nunca dentro de Docker: Docker Desktop en macOS no
      pasa la GPU al contenedor y el modelo caería a 2-8 tokens/s. Desde un
      contenedor hay que apuntar a host.docker.internal, no a 127.0.0.1: para eso
      está AULA_HOST_LLM.

  openai:
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    apto_para_menores: true
    notas: >-
      Único proveedor grande que documenta el uso por menores de 13 a 17 años
      con permiso de padre o tutor, y ofrece retención cero de datos.

  anthropic:
    base_url: https://api.anthropic.com/v1
    api_key_env: ANTHROPIC_API_KEY
    apto_para_menores: false
    notas: >-
      Sus términos exigen 18 años y no documentan consentimiento parental. Sirve
      para tareas por lotes sin niño delante, no para el tutor en vivo. Ojo: la
      suscripción Pro/Max no incluye créditos de API, se compran aparte.

  google:
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    apto_para_menores: false
    notas: >-
      La API para desarrolladores exige 18 años y prohíbe servicios dirigidos a
      menores. Family Link aplica a su app de consumo, no a lo que construyas tú.

perfiles:

  # Tu máquina, con los modelos que tienes cargados en LM Studio.
  #
  # El reparto respeta el coste de intercambio: en un Mac, cambiar de modelo
  # cuesta segundos o decenas de segundos de carga. Por eso los roles en vivo
  # comparten UNO solo (mientras el niño trabaja no se descarga nada) y los roles
  # por lotes comparten OTRO, que se carga una vez para toda la importación.
  #
  # Requiere "JIT model loading" activado en LM Studio para que pida el modelo
  # por nombre; si no, deja `auto` y usa el que tengas cargado.
  lmstudio:
    # --- en vivo, con el niño delante: siempre el mismo, sin recargas ---
    tutor:
      proveedor: lmstudio
      modelo: google/gemma-4-12b-qat
      temperatura: 0.3
      max_tokens: 400
      presupuesto_contexto: 1500
    anclaje:
      proveedor: lmstudio
      modelo: google/gemma-4-12b-qat
      temperatura: 0.0
      max_tokens: 64
    rubrica:
      proveedor: lmstudio
      modelo: google/gemma-4-12b-qat
      temperatura: 0.0
      max_tokens: 600

    # --- por lotes, sin nadie esperando: se puede pagar un modelo más grande ---
    extraccion:
      proveedor: lmstudio
      modelo: google/gemma-4-26b-a4b-qat
      temperatura: 0.0
      max_tokens: 4000
    enriquecimiento:
      # Inferir el grafo de prerrequisitos es el razonamiento más duro de todo
      # el pipeline, y es lo que ningún ministerio publica.
      proveedor: lmstudio
      modelo: qwen/qwen3.8-27b
      temperatura: 0.1
      max_tokens: 2000
    items:
      proveedor: lmstudio
      modelo: google/gemma-4-26b-a4b-qat
      temperatura: 0.7
      max_tokens: 2000
    resumen:
      # Estos resúmenes SON el índice RAG: se escriben una vez y se leen en cada
      # turno durante años. Un modelo chico basta y va mucho más rápido.
      proveedor: lmstudio
      modelo: google/gemma-4-e4b
      temperatura: 0.0
      max_tokens: 200
    embeddings:
      proveedor: lmstudio
      modelo: text-embedding-nomic-embed-text-v1.5
      temperatura: 0.0
      max_tokens: 0

  # Todo en el Mac con Ollama. Coste 0.
  local:
    embeddings:
      proveedor: ollama
      modelo: nomic-embed-text
      temperatura: 0.0
      max_tokens: 0
    tutor:
      proveedor: ollama
      modelo: qwen2.5:7b
      temperatura: 0.3
      max_tokens: 400          # el tutor responde en 2-3 frases, no en párrafos
      presupuesto_contexto: 1500
    anclaje:
      proveedor: ollama
      modelo: qwen2.5:1.5b     # es una clasificación binaria, no hace falta más
      temperatura: 0.0
      max_tokens: 64
    rubrica:
      proveedor: ollama
      modelo: qwen2.5:7b
      temperatura: 0.0
      max_tokens: 600
    extraccion:
      proveedor: ollama
      modelo: qwen2.5:7b
      temperatura: 0.0
      max_tokens: 4000
    enriquecimiento:
      proveedor: ollama
      modelo: qwen2.5:7b
      temperatura: 0.1
      max_tokens: 2000
    items:
      proveedor: ollama
      modelo: qwen2.5:7b
      temperatura: 0.7         # variedad en los ejercicios generados
      max_tokens: 2000
    resumen:
      proveedor: ollama
      modelo: qwen2.5:1.5b
      temperatura: 0.0
      max_tokens: 200

  # RECOMENDADO para empezar en serio.
  #
  # Caro donde el error es permanente, barato donde es recuperable: construir el
  # plan y los resúmenes del índice RAG pasa una vez por nivel y un prerrequisito
  # mal inferido envenena todas las sesiones futuras de ese tema; ejecutar clases
  # pasa miles de veces y un turno flojo se corrige en el turno siguiente.
  #
  # Coste: ~5-20 USD una sola vez por nivel, y ~0 al mes de operación.
  #
  # Lo único que hay que medir antes de fiarse: que el modelo local sostenga el
  # método socrático cuando el niño insista en que le den la respuesta. Si cede,
  # el tutor es la única pieza que vale la pena pagar (perfil `hibrido`).
  plan-premium:
    embeddings:
      proveedor: ollama
      modelo: nomic-embed-text
      temperatura: 0.0
      max_tokens: 0
    tutor:
      proveedor: ollama
      modelo: qwen2.5:7b
      temperatura: 0.3
      max_tokens: 400
      presupuesto_contexto: 1500
    anclaje:
      proveedor: ollama
      modelo: qwen2.5:1.5b
      temperatura: 0.0
      max_tokens: 64
    rubrica:
      proveedor: ollama
      modelo: qwen2.5:7b
      temperatura: 0.0
      max_tokens: 600
    extraccion:
      proveedor: anthropic
      modelo: claude-sonnet-5
      temperatura: 0.0
      max_tokens: 8000
    enriquecimiento:
      proveedor: anthropic     # inferir el grafo de prerrequisitos es lo que
      modelo: claude-opus-5    # ningún ministerio publica y lo que más compone
      temperatura: 0.1
      max_tokens: 4000
    items:
      proveedor: anthropic
      modelo: claude-sonnet-5
      temperatura: 0.7
      max_tokens: 4000
    resumen:
      proveedor: anthropic     # estos resúmenes SON el índice RAG: se escriben
      modelo: claude-haiku-4-5 # una vez y se leen en cada turno durante años
      temperatura: 0.0
      max_tokens: 200

  # Recomendado para las sesiones reales: el tutor en la nube, el resto local.
  # El tutor es donde se nota la diferencia; lo demás no la justifica.
  hibrido:
    embeddings:
      proveedor: ollama
      modelo: nomic-embed-text
      temperatura: 0.0
      max_tokens: 0
    tutor:
      proveedor: openai
      modelo: gpt-5-mini
      temperatura: 0.3
      max_tokens: 400
      presupuesto_contexto: 1500
    anclaje:
      proveedor: ollama
      modelo: qwen2.5:1.5b
      temperatura: 0.0
      max_tokens: 64
    rubrica:
      proveedor: openai
      modelo: gpt-5-mini
      temperatura: 0.0
      max_tokens: 600
    extraccion:
      proveedor: anthropic     # por lotes, sin niño delante
      modelo: claude-haiku-4-5
      temperatura: 0.0
      max_tokens: 8000
    enriquecimiento:
      proveedor: anthropic     # inferir prerrequisitos pide buen razonamiento
      modelo: claude-sonnet-5
      temperatura: 0.1
      max_tokens: 4000
    items:
      proveedor: anthropic
      modelo: claude-haiku-4-5
      temperatura: 0.7
      max_tokens: 4000
    resumen:
      proveedor: ollama
      modelo: qwen2.5:1.5b
      temperatura: 0.0
      max_tokens: 200

  # Todo en la nube. Máxima calidad, y aun así son unos pocos dólares al mes.
  nube:
    embeddings:
      proveedor: openai
      modelo: text-embedding-3-small
      temperatura: 0.0
      max_tokens: 0
    tutor:
      proveedor: openai
      modelo: gpt-5
      temperatura: 0.3
      max_tokens: 400
      presupuesto_contexto: 4000
    anclaje:
      proveedor: openai
      modelo: gpt-5-nano
      temperatura: 0.0
      max_tokens: 64
    rubrica:
      proveedor: openai
      modelo: gpt-5-mini
      temperatura: 0.0
      max_tokens: 600
    extraccion:
      proveedor: anthropic
      modelo: claude-sonnet-5
      temperatura: 0.0
      max_tokens: 8000
    enriquecimiento:
      proveedor: anthropic
      modelo: claude-opus-5
      temperatura: 0.1
      max_tokens: 4000
    items:
      proveedor: anthropic
      modelo: claude-sonnet-5
      temperatura: 0.7
      max_tokens: 4000
    resumen:
      proveedor: openai
      modelo: gpt-5-nano
      temperatura: 0.0
      max_tokens: 200
