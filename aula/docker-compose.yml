# Infraestructura local para desarrollo en el Mac.
# Todo corre en tu máquina: no hay nada en la nube hasta la Fase 6.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: aula
      POSTGRES_PASSWORD: aula
      POSTGRES_DB: aula
    ports:
      - "5432:5432"
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aula"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datos_db:
